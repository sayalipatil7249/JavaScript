<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <button>BUTTON CLICKED</button>
</body>
<script>
    class React {
        constructor(){
            this.library = "React"
            this.server = "https://localehost:300"

            //requirement
            document.querySelector('button').addEventListener('click',this.handleClick.bind(this))

        }
        handleClick(){
            console.log("Button clicked");
            console.log(this.server);
            
        }
    }
    const app = new React()
</script>
</html>

<!--
    i)bind() creates a new function with a fixed "this" value, preventing context loss
    ii)bind = permanently attach a function to an object
    iii)It does NOT run the function immediately. It returns a new function.
    iv)
-->
